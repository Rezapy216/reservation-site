<div class="card room-card mb-3">
  <div class="row g-0">
    <div class="col-md-4">
      {% if room.image %}<img src="{{ room.image.url }}" class="room-thumb" alt="{{ room.name }}">
      {% else %}<div class="room-thumb placeholder-img"><i class="bi bi-image"></i></div>{% endif %}
    </div>
    <div class="col-md-5 p-3">
      <h5 class="mb-1"><a class="text-decoration-none" href="{% url 'room_detail' room.pk %}">{{ room.name }}</a></h5>
      <div class="small text-muted mb-2"><i class="bi bi-people"></i> Up to {{ room.capacity }} guests · <i class="bi bi-rulers"></i> {{ room.size }} m²</div>
      <p class="small mb-2">{{ room.description|truncatewords:22 }}</p>
      <span class="badge text-bg-light border"><i class="bi bi-wifi"></i> Free Wi-Fi</span>
      <span class="badge text-bg-light border"><i class="bi bi-cup-hot"></i> Breakfast</span>
    </div>
    <div class="col-md-3 p-3 border-start d-flex flex-column justify-content-between text-md-end">
      <div><span class="rating-badge">{{ room.rating|default:"8.5" }}</span></div>
      <div>
        <div class="small text-muted">per night</div>
        <div class="price">${{ room.price }}</div>
        <a href="{% url 'room_detail' room.pk %}{% if request.GET.check_in %}?check_in={{ request.GET.check_in }}&check_out={{ request.GET.check_out }}{% endif %}" class="btn btn-primary btn-sm mt-2">See availability</a>
      </div>
    </div>
  </div>
</div>
