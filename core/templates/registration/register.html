{% extends "base.html" %}
{% block title %}Register — MyHotel{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:460px">
  <div class="card p-4">
    <h1 class="h4 mb-3">ساخت حساب</h1>
    <div id="apiMessages" class="alert alert-danger small d-none"></div>
    <form id="registerForm">
      <div class="mb-3"><label class="form-label">شماره موبایل</label>
        <input type="text" class="form-control" name="phone" placeholder="09XXXXXXXXX" required></div>
      <div class="mb-3"><label class="form-label">نام</label>
        <input type="text" class="form-control" name="name" required></div>
      <div class="mb-3"><label class="form-label">رمز عبور</label>
        <input type="password" class="form-control" name="password" required></div>
      <div class="mb-3"><label class="form-label">تکرار رمز عبور</label>
        <input type="password" class="form-control" name="confirm_password" required></div>
      <button type="submit" class="btn btn-primary w-100">ثبت‌نام</button>
    </form>
    <div class="small text-center mt-3">حساب دارید؟ <a href="{% url 'accounts:login' %}">ورود</a></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// if logged in it will redirect to home page
if (localStorage.getItem('rs_access')) {
  window.location.href = '/';
}
</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function () {
  $('#registerForm').on('submit', function (e) {
    e.preventDefault();
    var $msg = $('#apiMessages').addClass('d-none').empty();

    $.ajax({
      url: '/accounts/api/v1/registration/',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({
        phone: $('input[name=phone]').val(),
        name: $('input[name=name]').val(),
        password: $('input[name=password]').val(),
        confirm_password: $('input[name=confirm_password]').val()
      })
    })
    .done(function () {
      window.location.href = '/accounts/login/';
    })
    .fail(function (xhr) {
      var data = xhr.responseJSON || {};
      var parts = [];
      $.each(data, function (field, errs) {
        parts.push((Array.isArray(errs) ? errs.join(' ') : errs));
      });
      $msg.text(parts.join(' ') || 'ثبت‌نام انجام نشد.').removeClass('d-none');
    });
  });
});
</script>
{% endblock %}
